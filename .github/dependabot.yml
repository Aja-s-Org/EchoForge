version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'main'
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: 'eslint'
        versions: ['*']
